<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobTop Games</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 800px;
            margin: 50px auto;
            background-color: #1e1e1e;
            border: 2px solid #e5c158;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.7);
        }

        h1 {
            color: #e5c158;
            font-size: 36px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .status {
            color: #888888;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 40px;
        }

        .game-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px dashed #444444;
        }

        .game-section:last-of-type {
            border-bottom: none;
        }

        .game-title {
            color: #e5c158;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .store-links {
            margin-top: 15px;
        }

        .store-links a {
            display: inline-block;
            background-color: #2a2a2a;
            color: #e5c158;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 8px;
            border: 1px solid #e5c158;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .store-links a:hover {
            background-color: #e5c158;
            color: #121212;
        }

        .social-links {
            margin: 40px 0 20px 0;
        }

        .social-links a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        .social-links a:hover {
            color: #e5c158;
            text-decoration: underline;
        }

        .footer {
            color: #666666;
            font-size: 12px;
            margin-top: 30px;
        }

        .footer a {
            color: #666666;
            text-decoration: none;
        }

        .footer a:hover {
            color: #e5c158;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RobTop Games</h1>
        <p class="status">Under Construction</p>

        <!-- Boomlings Section -->
        <div class="game-section">
            <div class="game-title">Boomlings</div>
            <div class="store-links">
                <a href="#">App Store</a>
                <a href="#">Google Play</a>
            </div>
        </div>

        <!-- Boomlings MatchUp Section -->
        <div class="game-section">
            <div class="game-title">Boomlings MatchUp</div>
            <div class="store-links">
                <a href="#">App Store</a>
                <a href="#">Google Play</a>
            </div>
        </div>

        <!-- Memory Mastermind Section -->
        <div class="game-section">
            <div class="game-title">Memory Mastermind</div>
            <div class="store-links">
                <a href="#">App Store</a>
                <a href="#">Google Play</a>
            </div>
        </div>

        <!-- Social Media Navigation Links -->
        <div class="social-links">
            <a href="https://youtube.com" target="_blank">YouTube</a>
            <a href="https://twitter.com" target="_blank">Twitter</a>
            <a href="https://facebook.com" target="_blank">Facebook</a>
            <a href="https://discord.gg" target="_blank">Discord</a>
            <a href="https://www.reddit.com/r/geometrydash/" target="_blank">Reddit</a>
            <a href="https://twitch.tv" target="_blank">Twitch</a>
        </div>

        <!-- Contact Options -->
        <div class="store-links" style="margin-bottom: 40px;">
            <a href="mailto:support@robtopgames.com">Letter Contact</a>
        </div>

        <!-- Legal and Site Footer -->
        <div class="footer">
            <a href="#">Terms of Service</a> | <a href="#">Video Policy</a> | <a href="http://geometrydash.com" target="_blank">GeometryDash.com</a>
        </div>
    </div>

</body>
</html>
