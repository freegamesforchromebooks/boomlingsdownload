<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobTop Games - Download Games</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: #2ecc71;
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #888;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        .game-card {
            background-color: #262626;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }
        .game-icon {
            width: 80px;
            height: 80px;
            background-color: #333;
            border-radius: 18px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .game-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .download-btn {
            display: inline-block;
            background-color: #2ecc71;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #27ae60;
        }
        .footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #555;
            font-size: 0.9rem;
        }
        .footer-links a {
            color: #888;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer-links a:hover {
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RobTop Games</h1>
        <div class="subtitle">Download Classic Games</div>
        
        <div class="games-grid">
            <!-- Boomlings -->
            <div class="game-card">
                <div class="game-icon">💥</div>
                <div class="game-title">Boomlings</div>
                <a href="#" class="download-btn">Download</a>
            </div>
            
            <!-- Boomlings MatchUp -->
            <div class="game-card">
                <div class="game-icon">🧩</div>
                <div class="game-title">Boomlings MatchUp</div>
                <a href="#" class="download-btn">Download</a>
            </div>
            
            <!-- Memory Mastermind -->
            <div class="game-card">
                <div class="game-icon">🧠</div>
                <div class="game-title">Memory Mastermind</div>
                <a href="#" class="download-btn">Download</a>
            </div>
        </div>

        <div class="footer">
            <div class="footer-links" style="margin-bottom: 15px;">
                <a href="#">YouTube</a>
                <a href="#">Twitter</a>
                <a href="#">Facebook</a>
                <a href="#">Discord</a>
                <a href="#">Reddit</a>
                <a href="#">Twitch</a>
            </div>
            <p>Terms of Service | Video Policy | GeometryDash.com</p>
        </div>
    </div>
</body>
</html>
